name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: env -u NODE_OPTIONS node --test tests/frontend/isolation.test.mjs tests/frontend/vitest-mocker-security.test.mjs
      - run: npm run lint
      - run: env -u NODE_OPTIONS node tests/frontend/run-isolated.cjs build
      - run: env -u NODE_OPTIONS node tests/frontend/run-isolated.cjs test:run
      - run: env -u NODE_OPTIONS node tests/frontend/run-isolated.cjs test:coverage
      - run: npx playwright install --with-deps chromium
      - run: env -u NODE_OPTIONS node tests/frontend/run-isolated.cjs test:e2e

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password
          - image: mariadb:10.11
            health_command: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: reclive_test
          MYSQL_USER: reclive
          MYSQL_PASSWORD: reclive-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: ruff check server tests
      - run: python -m pytest -q
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: "3306"
          TEST_MYSQL_USER: reclive
          TEST_MYSQL_PASSWORD: reclive-ci-password
          TEST_MYSQL_DATABASE: reclive_test
          TEST_MYSQL_ADMIN_USER: root
          TEST_MYSQL_ADMIN_PASSWORD: root-ci-password
